# Hub - single Spring configuration file.
#
# Default: local profile (H2 file DB, no Docker required).
# Optional: SPRING_PROFILES_ACTIVE=postgresql or postgresql,prod.
# Environment-specific secrets stay in the root .env / process environment, not in YAML.

spring:
  application:
    name: hub
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  thymeleaf:
    encoding: UTF-8
  web:
    locale: ko-KR
    locale-resolver: fixed

server:
  address: ${HUB_BIND_ADDRESS:localhost}
  port: ${HUB_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    # Every expected error path already returns its own Korean message via ApiExceptionHandler;
    # this setting only affects genuinely unhandled exceptions, which must never leak internal
    # exception text/class names to the browser.
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

hub:
  storage-root: ${HUB_STORAGE_ROOT:./data/storage}
  ai-base-url: ${HUB_AI_BASE_URL:http://localhost:8000}
  demo-mode: ${HUB_DEMO_MODE:false}
  # Background AI jobs run one at a time so a folder import cannot outrun the Gemini per-minute quota.
  ai-job-concurrency: ${HUB_AI_JOB_CONCURRENCY:1}
  # Browser file upload is the normal web path. The server-side local reader remains disabled
  # unless an administrator deliberately configures safe roots.
  local-reader-roots: ${HUB_LOCAL_READER_ROOTS:}
  # One bundled fallback rule file. Runtime/admin rules are stored in DB; no duplicate root YAML is needed.
  search-rules-file: classpath:config/search-rules.yml
  search-whole-document-max-chars: ${HUB_SEARCH_WHOLE_DOCUMENT_MAX_CHARS:12000}
  search-neighbor-chunks: ${HUB_SEARCH_NEIGHBOR_CHUNKS:2}
  search-max-documents: ${HUB_SEARCH_MAX_DOCUMENTS:3}
  rag-max-chunks: ${HUB_RAG_MAX_CHUNKS:16}
  rag-max-context-chars: ${HUB_RAG_MAX_CONTEXT_CHARS:30000}
  embedding-retry-enabled: ${HUB_EMBED_RETRY_ENABLED:true}
  embedding-retry-interval-ms: ${HUB_EMBED_RETRY_INTERVAL_MS:600000}
  embedding-retry-initial-delay-ms: ${HUB_EMBED_RETRY_INITIAL_DELAY_MS:60000}
  # Only DONE todos past their due date are ever removed; documents/meetings/evidence are never touched.
  todo-retention-enabled: ${HUB_TODO_RETENTION_ENABLED:true}
  todo-retention-months: ${HUB_TODO_RETENTION_MONTHS:12}
  todo-retention-interval-ms: ${HUB_TODO_RETENTION_INTERVAL_MS:86400000}
  todo-retention-initial-delay-ms: ${HUB_TODO_RETENTION_INITIAL_DELAY_MS:300000}
  # Log-shaped tables only (expired sessions, search log, orphaned connector import history) - live
  # application data such as documents/meetings/evidence is never touched by this job.
  data-retention-enabled: ${HUB_DATA_RETENTION_ENABLED:true}
  data-retention-months: ${HUB_DATA_RETENTION_MONTHS:12}
  data-retention-interval-ms: ${HUB_DATA_RETENTION_INTERVAL_MS:86400000}
  data-retention-initial-delay-ms: ${HUB_DATA_RETENTION_INITIAL_DELAY_MS:600000}
  github-token: ${GITHUB_TOKEN:}
  google-access-token: ${GOOGLE_ACCESS_TOKEN:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  google-refresh-token: ${GOOGLE_REFRESH_TOKEN:}
  slack-token: ${SLACK_TOKEN:}
  notion-token: ${NOTION_TOKEN:}
  github-client-id: ${GITHUB_CLIENT_ID:}
  github-client-secret: ${GITHUB_CLIENT_SECRET:}
  slack-client-id: ${SLACK_CLIENT_ID:}
  slack-client-secret: ${SLACK_CLIENT_SECRET:}
  slack-team-id: ${SLACK_TEAM_ID:}
  notion-client-id: ${NOTION_CLIENT_ID:}
  notion-client-secret: ${NOTION_CLIENT_SECRET:}
  # Address the browser uses to reach Hub. OAuth callbacks are built from this, so it must match
  # what each provider has registered. Empty means "derive it from the incoming request".
  public-base-url: ${HUB_PUBLIC_BASE_URL:}
  # Off by default: a connector token above is only ever used by the account that linked it. Turning
  # this on lets every user fall back to that one shared token/account for a connector they haven't
  # personally linked - only appropriate for a single-tenant demo, never when users must stay isolated.
  allow-shared-connector-fallback: ${HUB_ALLOW_SHARED_CONNECTOR_FALLBACK:false}
  # Keyed hash used to redact resident-registration/card/phone numbers and emails out of STT
  # transcripts before they are stored or searched. Admin-set and secret: without it, a random
  # key is generated per run (redacted values then won't match across restarts).
  stt-pii-hash-key: ${HUB_STT_PII_HASH_KEY:}
  # BootstrapService creates exactly one admin from these when the install has zero admins yet (admin
  # signup never self-approves, so without this nobody could ever get in to approve anyone). Set only
  # in this server's own untracked .env - never commit a value for HUB_BOOTSTRAP_ADMIN_PASSWORD. A blank
  # password (the default) means bootstrap does nothing and logs a reminder to set it.
  bootstrap-admin-login-id: ${HUB_BOOTSTRAP_ADMIN_LOGIN_ID:admin}
  bootstrap-admin-password: ${HUB_BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    secret: ${HUB_JWT_SECRET:hub-local-only-secret-ChangeMe-1234567890}
    issuer: ${HUB_JWT_ISSUER:hub}
    audience: ${HUB_JWT_AUDIENCE:hub-web}
    access-ttl: ${HUB_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${HUB_JWT_REFRESH_TTL:30d}
    secure-cookies: ${HUB_COOKIE_SECURE:false}
    same-site: ${HUB_COOKIE_SAMESITE:Strict}
    max-failed-attempts: ${HUB_LOGIN_MAX_ATTEMPTS:5}
    lock-duration: ${HUB_LOGIN_LOCK_DURATION:15m}
    enforce-secure-config: ${HUB_ENFORCE_SECURE_CONFIG:false}

logging:
  level:
    com.hub: INFO

---
# Local/intranet development profile. This is the default and needs no database installation.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/hubdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/h2
  thymeleaf:
    cache: false

---
# PostgreSQL/pgvector profile for larger intranet installations or container deployment.
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub}
    username: ${DB_USER:hub}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET client_encoding TO 'UTF8'
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgresql

---
# Production hardening can be combined with PostgreSQL: SPRING_PROFILES_ACTIVE=postgresql,prod
spring:
  config:
    activate:
      on-profile: prod
server:
  forward-headers-strategy: framework
  error:
    include-message: never
hub:
  demo-mode: false
  jwt:
    secure-cookies: true
    enforce-secure-config: true
