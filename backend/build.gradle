plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hub'
version = '2.34.0'
description = 'Local-first intranet web AI work assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    tikaVersion = '3.2.3'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "org.apache.tika:tika-core:${tikaVersion}"
    implementation "org.apache.tika:tika-parsers-standard-package:${tikaVersion}"
    // Must match the POI version tika-parent:${tikaVersion} declares (see its <poi.version>), or this
    // pin wins over Tika's own transitive poi-ooxml/poi-ooxml-lite request while poi/poi-scratchpad
    // still resolve to Tika's newer version - a split classpath that throws NoSuchMethodError the
    // moment Tika's microsoft-module parses a real .docx/.xlsx (SpreadsheetService's own direct POI
    // usage never crosses that boundary, so it kept working while general document upload didn't).
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.language', 'ko'
    systemProperty 'user.country', 'KR'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('bootRun') {
    jvmArgs '-Dfile.encoding=UTF-8', '-Duser.language=ko', '-Duser.country=KR'
}

tasks.named('bootJar') {
    archiveFileName = 'hub-backend.jar'
}
