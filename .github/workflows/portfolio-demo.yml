name: Hub portfolio demo video

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portfolio-demo.yml'
      - 'scripts/record_portfolio_demo.py'
      - 'web/**'
      - 'frontend/**'
      - 'backend/**'

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare isolated demo settings
        shell: bash
        run: |
          set -euo pipefail
          demo_credential="Demo-${GITHUB_RUN_ID}-Aa1!"
          {
            echo "HUB_DEMO_ADMIN_LOGIN_ID=video-admin"
            echo "HUB_DEMO_MEMBER_LOGIN_ID=video-member"
            echo "HUB_DEMO_ADMIN_PASSWORD=$demo_credential"
            echo "HUB_DEMO_MEMBER_PASSWORD=$demo_credential"
            echo "HUB_DEMO_MODE=true"
            echo "HUB_COOKIE_SECURE=false"
            echo "HUB_ENFORCE_SECURE_CONFIG=false"
            echo "HUB_CONNECTOR_AUTO_SYNC_ENABLED=false"
            echo "HUB_EMBED_RETRY_ENABLED=false"
            echo "HUB_TODO_RETENTION_ENABLED=false"
            echo "HUB_DATA_RETENTION_ENABLED=false"
            echo "HUB_DEMO_BASE_URL=http://127.0.0.1:8080"
            echo "HUB_DEMO_VIDEO_DIR=artifacts/portfolio-demo/raw"
            echo "HUB_DEMO_GITHUB_REPOSITORY=chl4890620123-collab/hub"
          } >> "$GITHUB_ENV"

      - name: Build the real browser application
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run typecheck
          npm --prefix web run build

          rm -rf backend/src/main/resources/static/assets
          mkdir -p backend/src/main/resources/static/js
          cp -R web/dist/. backend/src/main/resources/static/
          cp frontend/dist/hub-runtime.js backend/src/main/resources/static/js/hub-runtime.js
          cp frontend/dist/login.js backend/src/main/resources/static/js/login.js

      - name: Install recording dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start isolated Hub demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/data artifacts/portfolio-demo
          mkdir -p artifacts/portfolio-demo/raw artifacts/portfolio-demo/mp4
          (
            cd backend
            nohup gradle --no-daemon bootRun > "$RUNNER_TEMP/hub-portfolio.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/hub-portfolio.pid"
          )
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/hub-portfolio.log" || true
            exit 1
          fi

      - name: Record administrator, search, repository CRUD and member flows
        shell: bash
        run: |
          set -euo pipefail
          python scripts/record_portfolio_demo.py

      - name: Encode clips and assemble portfolio master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/portfolio-demo/mp4
          for f in artifacts/portfolio-demo/raw/*.webm; do
            base="$(basename "$f" .webm)"
            ffmpeg -y -loglevel error -i "$f" \
              -vf "fps=30,scale=1600:900:force_original_aspect_ratio=decrease,pad=1600:900:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an \
              "artifacts/portfolio-demo/mp4/${base}.mp4"
          done

          concat_file="$RUNNER_TEMP/portfolio-concat.txt"
          : > "$concat_file"
          for name in 00_intro 01_admin_flow 02_search_comparison 03_repository_crud 04_member_flow 05_admin_finish 06_explainer; do
            printf "file '%s'\n" "$GITHUB_WORKSPACE/artifacts/portfolio-demo/mp4/${name}.mp4" >> "$concat_file"
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i "$concat_file" -c copy \
            artifacts/portfolio-demo/Hub_Portfolio_Demo.mp4

          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 artifacts/portfolio-demo/Hub_Portfolio_Demo.mp4

      - name: Upload portfolio video
        uses: actions/upload-artifact@v7
        with:
          name: hub-portfolio-demo
          path: |
            artifacts/portfolio-demo/Hub_Portfolio_Demo.mp4
            artifacts/portfolio-demo/mp4/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Show Hub log on failure
        if: failure()
        shell: bash
        run: |
          tail -n 300 "$RUNNER_TEMP/hub-portfolio.log" || true
